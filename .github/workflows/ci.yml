name: CI Pipeline & Credit Risk Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Generate Synthetic Validation Data
      run: |
        python generate_sample_data.py --loans-per-vintage 100 --out-dir data/raw

    - name: Execute End-to-End Pipeline
      run: |
        python run_pipeline.py --all

    - name: Verify All Output Artifacts
      run: |
        python run_pipeline.py --verify

    - name: Run Test Suite
      run: |
        pytest -v tests/
